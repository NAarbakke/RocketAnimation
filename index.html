<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Twilight Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #EAF0F7;
    --dim: #8C99AB;
    --line: rgba(234, 240, 247, .22);
    --amber: #FFB35C;
    --glass: rgba(5, 8, 14, .46);
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --cond: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #020306; color: var(--ink); overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  .hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    font-family: var(--mono); font-size: 12px; text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  .mission h1 { margin: 2px 0 0; font-family: var(--cond); font-weight: 700; font-size: clamp(22px, 3vw, 30px); letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
  .mission p { margin: 6px 0 0; color: var(--dim); font-size: 11px; }
  .warp { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .warp b { font-family: var(--cond); font-weight: 600; font-size: 22px; letter-spacing: .08em; color: var(--amber); font-variant-numeric: tabular-nums; }
  .warp span { color: var(--dim); font-size: 11px; }
  .caption {
    position: fixed; left: 50%; top: 24%; transform: translateX(-50%);
    font-family: var(--cond); font-weight: 600; font-size: clamp(18px, 2.6vw, 28px); letter-spacing: .32em; text-transform: uppercase;
    text-align: center; opacity: 0; transition: opacity .6s ease; white-space: nowrap; max-width: calc(100vw - 32px);
  }
  .caption small { display: block; margin-top: 6px; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .06em; text-transform: none; color: var(--dim); white-space: normal; }
  .caption.on { opacity: 1; }
  .bottom { display: grid; gap: 14px; }
  .timeline { position: relative; height: 46px; margin: 0 8px; }
  .track { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 22px; height: 2px; background: var(--ink); width: 0; }
  .tick {
    position: absolute; top: 16px; width: 14px; height: 14px; margin-left: -7px; padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto;
  }
  .tick::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 1.5px solid var(--ink); background: #05080e; }
  .tick.done::before { background: var(--ink); }
  .tick span {
    position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--cond); font-weight: 600; font-size: 11px;
    letter-spacing: .16em; white-space: nowrap; color: var(--dim);
  }
  .tick:nth-child(odd) span { bottom: 16px; }
  .tick:nth-child(even) span { top: 16px; }
  .tick.done span { color: var(--ink); }
  .tick:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 50%; }
  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 16px; }
  .tele { display: flex; gap: 22px; flex-wrap: wrap; }
  .g { display: grid; gap: 3px; min-width: 92px; }
  .g label { font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .g b { font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
  .g b small { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 3px; }
  .bar { height: 2px; background: var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: var(--amber); }
  .clock { text-align: center; }
  .clock .eyebrow { display: block; }
  .clock b { font-weight: 500; font-size: clamp(26px, 4vw, 40px); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .btn {
    text-decoration: none; pointer-events: auto; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink); background: var(--glass); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px);
  }
  .btn:hover { border-color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .btn[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }
  /* lab switcher, same as src/shared/lab.css */
  .labs { display: flex; width: fit-content; pointer-events: auto; border: 1px solid rgba(234, 240, 247, .28); background: var(--glass); margin-bottom: 8px; }
  .labs a { font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); text-decoration: none; padding: 5px 10px; }
  .labs a + a { border-left: 1px solid rgba(234, 240, 247, .28); }
  .labs a:hover { color: var(--ink); }
  .labs a[aria-current="page"] { background: var(--ink); color: #05080e; }
  .labs a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #err[hidden] { display: none; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; font-family: var(--mono); color: var(--dim); }
  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; justify-items: start; }
    .clock { text-align: left; order: -1; }
    .ctl { justify-content: flex-start; }
    .tele { gap: 14px; }
    .g { min-width: 76px; }
    .g b { font-size: 16px; }
    .tick span { display: none; }
    .mission p, .warp span { display: none; }
    .caption { top: 18%; letter-spacing: .18em; }
  }
</style>

<canvas id="c" aria-label="3D animation of a rocket launching at twilight and climbing to orbit"></canvas>
<div id="err" hidden>WebGL is not available in this browser, so the launch cannot render.</div>

<div class="hud">
  <div class="top">
    <div class="mission">
      <nav class="labs" aria-label="Labs"><a href="index.html" aria-current="page">Launch</a><a href="engine.html">Liquid engine</a><a href="srm.html">Solid motor</a></nav>
      <span class="eyebrow">Kestrel 9 · Flight 12 · LC-39</span>
      <h1>Twilight Ascent</h1>
      <p>Drag to look around · scroll to zoom · double-click to reset view</p>
    </div>
    <div class="warp">
      <span class="eyebrow">Time warp</span>
      <b id="warp">1×</b>
      <span id="stage">Stage 1 · on pad</span>
    </div>
  </div>

  <div class="caption" id="cap"></div>

  <div class="bottom">
    <div class="timeline" id="tl">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
    </div>
    <div class="row">
      <div class="tele">
        <div class="g"><label>Speed</label><b id="spd">0<small>km/h</small></b><div class="bar"><i id="spdBar"></i></div></div>
        <div class="g"><label>Altitude</label><b id="alt">0.0<small>km</small></b><div class="bar"><i id="altBar"></i></div></div>
        <div class="g"><label>Downrange</label><b id="dr">0<small>km</small></b><div class="bar"><i id="drBar"></i></div></div>
      </div>
      <div class="clock"><span class="eyebrow">Mission elapsed</span><b id="clk">T−00:00:10</b></div>
      <div class="ctl">
        <button class="btn" id="bSound" aria-pressed="false">Sound</button>
        <button class="btn" id="bPause" aria-pressed="false">Pause</button>
        <button class="btn" id="bReplay">Replay</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/launch/main.js"></script>
